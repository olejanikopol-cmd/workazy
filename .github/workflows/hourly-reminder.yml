name: Hourly Workazy reminder

on:
  schedule:
    # GitHub иногда задерживает или пропускает одиночные scheduled runs.
    # Несколько попыток в час дают резерв, а серверный lock всё равно
    # пропускает в Telegram только одно сообщение за час.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/hourly-reminder.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: workazy-hourly-reminder
  cancel-in-progress: false

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request GitHub identity token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: return await core.getIDToken('workazy-hourly')
          result-encoding: string

      - name: Trigger Telegram digest
        env:
          GITHUB_ID_TOKEN: ${{ steps.oidc.outputs.result }}
        run: |
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer $GITHUB_ID_TOKEN" \
            "https://personal-planner.uchepir.chatgpt.site/api/telegram/hourly"
