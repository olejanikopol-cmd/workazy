name: Hourly Workazy reminder

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: workazy-hourly-reminder
  cancel-in-progress: false

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Telegram digest
        env:
          WORKAZY_API_TOKEN: ${{ secrets.WORKAZY_API_TOKEN }}
        run: |
          test -n "$WORKAZY_API_TOKEN"
          curl --fail-with-body --silent --show-error --retry 2 \
            --request POST \
            --header "Authorization: Bearer $WORKAZY_API_TOKEN" \
            "https://personal-planner.uchepir.chatgpt.site/api/v1/reminders/tick"
