name: Hourly Workazy reminder

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/hourly-reminder.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: workazy-hourly-reminder
  cancel-in-progress: false

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Request GitHub identity token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: return await core.getIDToken('workazy-hourly')
          result-encoding: string

      - name: Trigger Telegram digest
        env:
          GITHUB_ID_TOKEN: ${{ steps.oidc.outputs.result }}
        run: |
          curl --fail-with-body --silent --show-error --retry 2 \
            --request POST \
            --header "Authorization: Bearer $GITHUB_ID_TOKEN" \
            "https://personal-planner.uchepir.chatgpt.site/api/telegram/hourly"
